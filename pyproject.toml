[project]
name = "data-center-impacts"
version = "0.1.0"
description = "MC-DSS of data center impacts: SVI/SEVI + data center impact buffers (Rockland County, NY case study)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "mcda>=1.1.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pymcda>=0.4",
    "pyogrio",
    "rasterio>=1.5.2",
    "typer>=0.28.0",
]

[project.scripts]
dc_impacts = "dc_impacts.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_impacts"]
