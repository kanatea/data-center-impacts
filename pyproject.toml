[project]
name = "data-center-impacts"
version = "0.1.0"
description = "MC-DSS of data center impacts: SEVI + data center impact buffers (Rockland County default)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "esda>=2.10.0",
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "libpysal>=4.15.1",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
    "mcda>=1.1.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pygris>=0.2.1",
    "pymcda>=0.4",
    "pymcdm>=1.4.0",
    "pyogrio",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "rasterstats>=0.21.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "splot>=1.1.7",
    "streamlit>=1.67.0",
    "streamlit-folium>=0.27.4",
    "typer>=0.28.0",
]

[project.scripts]
dc_impacts = "dc_impacts.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_impacts"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
